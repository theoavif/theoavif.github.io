<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Theo Avif</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --black: #111111; --gray: #888888; --white: #ffffff; --border: #e8e8e8; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--white); color: var(--black); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; }
  h1 { font-family: 'Outfit', sans-serif; font-size: clamp(4rem, 15vw, 10rem); font-weight: 200; letter-spacing: 0.1em; line-height: 1; }
  p { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); }
  a { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--black); text-decoration: none; border-bottom: 1px solid var(--black); padding-bottom: 2px; transition: opacity 0.2s; }
  a:hover { opacity: 0.5; }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Cette page n'existe pas.</p>
  <a href="/">← Retour à l'accueil</a>
</body>
</html>
