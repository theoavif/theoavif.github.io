<!DOCTYPE html>
<!-- landing v1.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo Avif</title>
<meta name="description" content="Theo Avif — French artist based in Barcelona. Gallery and Services.">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Outfit', sans-serif;
  }

  .split {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  .side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: flex 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }

  .side:hover { flex: 1.2; }

  .side-left {
    background: #111;
  }

  .side-right {
    background: #fff;
    border-left: 1px solid #e0e0e0;
  }

  .side-label {
    font-size: clamp(1.8rem, 4vw, 3.5rem);
    font-weight: 200;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: letter-spacing 0.4s ease;
  }

  .side:hover .side-label {
    letter-spacing: 0.3em;
  }

  .side-left .side-label { color: #fff; }
  .side-right .side-label { color: #111; }

  .side-sub {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.75rem;
    opacity: 0.4;
  }

  .side-left .side-sub { color: #fff; }
  .side-right .side-sub { color: #111; }

  .divider {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1px;
    height: 40px;
    background: #888;
    z-index: 10;
    pointer-events: none;
  }

  /* VIBRATION sur les labels */
  @keyframes vibrate {
    0%   { transform: translateX(0); }
    15%  { transform: translateX(-3px); }
    30%  { transform: translateX(3px); }
    45%  { transform: translateX(-2px); }
    60%  { transform: translateX(2px); }
    75%  { transform: translateX(-1px); }
    90%  { transform: translateX(1px); }
    100% { transform: translateX(0); }
  }

  .side-label.vibrating {
    animation: vibrate 0.5s ease;
  }

  /* FOOTER */
  .landing-footer {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888;
    z-index: 20;
    pointer-events: none;
  }

  /* MOBILE */
  @media (max-width: 600px) {
    .side-label { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="split">
  <a class="side side-left" href="services.html">
    <div class="side-label" id="labelServices">Services</div>
    <div class="side-sub">Photography · Art Direction · Web</div>
  </a>
  <a class="side side-right" href="gallery.html">
    <div class="side-label" id="labelGallery">Gallery</div>
    <div class="side-sub">Painting · Collage · Photography</div>
  </a>
</div>

<div class="divider"></div>

<div class="landing-footer">Theo Avif — Barcelona</div>

<script>
  // Vibration toutes les 5 secondes sur les deux labels
  const labels = [
    document.getElementById('labelServices'),
    document.getElementById('labelGallery')
  ];

  setInterval(() => {
    labels.forEach(label => {
      label.classList.add('vibrating');
      setTimeout(() => label.classList.remove('vibrating'), 500);
    });
  }, 5000);
</script>
</body>
</html>
