<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo Avif — Artiste | Peinture, Collage & Photographie Argentique | Barcelona</title>
<meta name="description" content="Theo Avif est un artiste français basé à Barcelona. Peinture, collage et photographie argentique. Galerie d'art contemporain, expositions et tirages fine art disponibles.">
<meta property="og:title" content="Theo Avif — Artiste | Barcelona">
<meta property="og:description" content="Artiste français basé à Barcelona. Peinture, collage et photographie argentique. Art contemporain.">
<meta property="og:url" content="https://theoavif.com">
<meta property="og:type" content="website">
<link rel="canonical" href="https://theoavif.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --black: #111111; --gray: #888888; --white: #ffffff; --border: #e8e8e8; }
  html, body { height: 100%; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--white); color: var(--black); }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 52px; }
  .nav-logo { text-decoration: none; display: flex; align-items: center; }

  @keyframes coin-spin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
  .logo-coin { display: inline-grid; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; animation: coin-spin 5s linear infinite; }
  .logo-face { grid-area: 1/1; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; }
  .logo-face img { height: 40px; width: auto; display: block; }
  .logo-back img { height: 35px; }
  .logo-front { transform: translateZ(0.01px); -webkit-transform: translateZ(0.01px); }
  .logo-back { transform: rotateY(180deg) translateZ(0.01px); -webkit-transform: rotateY(180deg) translateZ(0.01px); }

  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; color: var(--gray); transition: color 0.2s; }
  .nav-links a:hover { color: var(--black); }

  .splash { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding-top: 52px; }

  .entry-link { text-decoration: none; color: var(--black); display: flex; flex-direction: column; align-items: center; gap: 1rem; cursor: pointer; }

  .entry-link h1 {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 200;
    letter-spacing: 0.15em;
    transition: opacity 0.3s;
  }

  .entry-hint {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gray);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s, transform 0.3s;
  }

  .entry-link:hover h1 { opacity: 0.6; }
  .entry-link:hover .entry-hint { opacity: 1; transform: translateY(0); }

  footer { position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid var(--border); padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; background: var(--white); }
  footer p, footer a { font-size: 11px; color: var(--gray); letter-spacing: 0.05em; text-decoration: none; }
  footer a:hover { color: var(--black); }

  img { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; pointer-events: none; }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <div class="logo-coin">
      <div class="logo-face logo-front"><img src="logo.png" alt="avif"></div>
      <div class="logo-face logo-back"><img src="theo.png" alt="theo"></div>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="https://instagram.com/theo.avif" target="_blank">Instagram</a></li>
    <li><a href="mailto:theoavif@gmail.com">Contact</a></li>
  </ul>
</nav>

<div class="splash">
  <a class="entry-link" href="/gallery">
    <h1>GALLERY</h1>
    <span class="entry-hint">→ entrer</span>
  </a>
</div>

<footer>
  <p>© 2026 Theo Avif</p>
  <a href="https://instagram.com/theo.avif" target="_blank">@theo.avif</a>
</footer>

</body>
</html>
