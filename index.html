<!DOCTYPE html>
<!-- index v1.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo Avif</title>
<meta name="description" content="Theo Avif — French artist based in Barcelona. Analogue photography, collage and painting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-decoration: none;
    color: #000;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .title {
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 200;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }
  .sub {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #999;
  }
  .footer {
    position: fixed;
    bottom: 24px;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #ccc;
  }
  @keyframes vibrate {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-1px); }
    75% { transform: translateX(1px); }
  }
</style>
</head>
<body>
<a class="container" href="gallery/">
  <div class="title" id="mainTitle">Gallery</div>
  <div class="sub">Theo Avif — Barcelona</div>
</a>
<div class="footer">theoavif.com</div>
<script>
  setInterval(() => {
    const el = document.getElementById('mainTitle');
    el.style.animation = 'vibrate 0.1s linear 3';
    setTimeout(() => el.style.animation = '', 300);
  }, 4000);
</script>
</body>
</html>
